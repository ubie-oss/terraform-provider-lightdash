\* Current code with a user who edits the value in the Lightdash UI while an apply runs.
\* The PUT writes back the value that the GET read, so the UI edit is lost.
SPECIFICATION Spec
CONSTANTS
  UserValues = {"us", "eu"}
  Empty = "none"
  KeepUsers = TRUE
  EditsDuringApply = TRUE
  MaxEdits = 1
INVARIANTS
  ValueSurvivesApply
