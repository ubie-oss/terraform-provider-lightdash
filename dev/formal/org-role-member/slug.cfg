\* A code variant that sends built-in organization role slugs without a catalog lookup.
\* Live catalog, UseCatalog = FALSE: the invariants should hold.
SPECIFICATION Spec
CONSTANTS
  Roles = {"member", "viewer", "interactive_viewer", "editor", "developer", "admin"}
  Catalog = {"viewer", "interactive_viewer", "editor", "developer", "admin"}
  UseCatalog = FALSE
INVARIANTS
  NoRoleNotFound
  StateMatchesAssignment
  UnmanagedIsDefault
