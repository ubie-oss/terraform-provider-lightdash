\* The live Lightdash v0.3240.0 org role catalog, as reported in issue #461:
\* project-level slugs and custom roles, but no organization-level "member".
\* Current code (AssignOrgUserRole -> ResolveRoleID) resolves names through it.
SPECIFICATION Spec
CONSTANTS
  Roles = {"member", "viewer", "interactive_viewer", "editor", "developer", "admin"}
  Catalog = {"viewer", "interactive_viewer", "editor", "developer", "admin"}
  UseCatalog = TRUE
INVARIANTS
  NoRoleNotFound
  StateMatchesAssignment
  UnmanagedIsDefault
