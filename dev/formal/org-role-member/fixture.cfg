\* The catalog that the unit and contract tests assume: every built-in role is listed,
\* including "member". With this catalog the invariants hold, which is why the
\* tests did not catch issue #461.
SPECIFICATION Spec
CONSTANTS
  Roles = {"member", "viewer", "interactive_viewer", "editor", "developer", "admin"}
  Catalog = {"member", "viewer", "interactive_viewer", "editor", "developer", "admin"}
  UseCatalog = TRUE
INVARIANTS
  NoRoleNotFound
  StateMatchesAssignment
  UnmanagedIsDefault
